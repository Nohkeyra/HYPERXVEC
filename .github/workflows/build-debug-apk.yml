name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web (Vite)
      run: npm run build

    - name: Ensure Capacitor CLI
      run: npm install @capacitor/cli --no-save

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Verify Gradle Wrapper
      run: |
        echo "Checking gradle wrapper files..."
        ls -la android/gradle/wrapper/
        file android/gradle/wrapper/gradle-wrapper.jar
        echo "Gradle wrapper properties:"
        cat android/gradle/wrapper/gradle-wrapper.properties

    - name: Clean Gradle cache
      run: |
        rm -rf ~/.gradle/caches/
        cd android && ./gradlew clean || true

    - name: Grant Gradle permission
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

    - name: Comment on PR if build fails
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Android Debug Build Failed. Please check the action logs.'
          })

    - name: Comment on PR if build succeeds
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Android Debug Build Succeeded! You can download the APK from the Actions artifacts.'
          })
