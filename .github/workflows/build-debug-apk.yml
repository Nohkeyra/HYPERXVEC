name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web (Vite)
      run: npm run build

    - name: Ensure Capacitor CLI
      run: npm install @capacitor/cli --no-save

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses

    - name: Verify Gradle Wrapper
      run: |
        echo "Checking gradle wrapper files..."
        ls -la android/gradle/wrapper/
        file android/gradle/wrapper/gradle-wrapper.jar
        echo "Gradle wrapper properties:"
        cat android/gradle/wrapper/gradle-wrapper.properties

    - name: Clean Gradle cache
      run: |
        rm -rf ~/.gradle/caches/
        cd android && ./gradlew clean || true

    - name: Grant Gradle permission
      run: chmod +x android/gradlew

    - name: Build Release APK
      working-directory: ./android
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: warn

    - name: Comment on PR if build fails
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Android Release Build Failed. Please check the action logs.'
          })

    - name: Comment on PR if build succeeds
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Android Release Build Succeeded! You can download the APK from the Actions artifacts.'
          })
